<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MangoFitness | Body Metrics</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260905-run-800m-name" />
  <link rel="manifest" href="manifest.webmanifest?v=20260905-run-800m-name" />
  <link rel="apple-touch-icon" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MangoFitness" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="assets/supabase-config.js"></script>
</head>
<body class="has-mobile-bottom-nav">
  <main class="container">
    <section class="card hero topbar app-shell">
      <div class="hero-main">
        <div class="brand-heading app-header-inner">
          <a class="brand-home-link" href="index.html" aria-label="MangoFitness home">
            <img class="app-brand-logo portal-brand-logo" src="assets/mangofitness-logo.png?v=20260711-landing-repair" alt="MangoFitness" />
          </a>
          <div class="portal-heading">
            <h1>Body Metrics</h1>
          </div>
        </div>
        <div class="app-nav-row">
          <nav class="app-tabs athlete-nav" aria-label="Athlete navigation">
            <a href="athlete.html" class="app-tab">Workouts</a>
            <a href="athlete-metrics.html" class="app-tab active" aria-current="page">Body Metrics</a>
            <a href="athlete-history.html" class="app-tab">Progress</a>
            <a href="athlete-leaderboard.html" class="app-tab">Benchmarks</a>
          </nav>
        </div>
        <div id="metricsHeaderAuth" class="header-auth hidden">
          <p id="metricsDashboardMessage" class="muted"></p>
          <button type="button" id="metricsSignOutBtn" class="app-sign-out header-sign-out hidden">Sign out</button>
        </div>
      </div>
      <p class="muted hero-description">Upload body composition scans and track changes over time.</p>
    </section>

    <section id="metricsAuthCard" class="card auth-card">
      <h2>Athlete Sign In</h2>
      <div class="field"><label for="metricsEmail">Email</label><input id="metricsEmail" type="email" placeholder="Email" /></div>
      <div class="field"><label for="metricsPassword">Password</label><input id="metricsPassword" type="password" placeholder="Password" /></div>
      <div class="actions" style="margin-top:14px;"><button type="button" id="metricsSignInBtn" class="primary">Sign In</button><button type="button" id="metricsForgotBtn">Forgot Password</button></div>
      <p id="metricsAuthMessage" class="muted hidden" style="margin:12px 0 0;"></p>
    </section>

    <section id="metricsDashboard" class="dashboard-stack hidden">
      <div class="card dashboard-card">
        <div class="section-head compact"><div><h2>Body Metrics</h2><p class="muted">Upload a BodySpec or InBody PDF, or take a photo on iPhone.</p></div></div>
        <div class="scan-upload-grid">
          <div class="field"><label for="bodyScanPdf">Scan file or photo</label><input id="bodyScanPdf" type="file" accept="application/pdf,image/*" /></div>
          <button type="button" id="parseBodyScanBtn">Parse Scan</button>
        </div>
        <div id="bodyScanPreview" class="hidden"></div>
        <div class="section-head compact scan-history-head"><div><h3>Saved scans</h3><p class="muted">Your uploaded body scan history appears here.</p></div></div>
        <div id="bodyScanChart" class="body-scan-chart"></div>
        <div class="field chart-metric-field chart-metric-below"><label for="bodyScanChartMetric">Chart metric</label><select id="bodyScanChartMetric"><option value="bodyWeight">Weight</option><option value="skeletalMuscleMass">SMM</option><option value="bodyFatPercent">PBF</option></select></div>
        <div id="bodyScanList" class="list-stack"></div>
      </div>
    </section>
  </main>
  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="athlete.html">Today</a>
    <a href="athlete-history.html">Progress</a>
    <a href="athlete-metrics.html" class="active" aria-current="page">Metrics</a>
    <a href="athlete-leaderboard.html">Board</a>
  </nav>
  <script src="assets/auth.js?v=20260905-mobile-auth"></script>
  <script src="assets/app.js?v=20260905-run-800m-name"></script>
  <script>
    initLoginPage({ emailId:"metricsEmail", passwordId:"metricsPassword", signInBtnId:"metricsSignInBtn", forgotBtnId:"metricsForgotBtn", signOutBtnId:"metricsSignOutBtn", authCardId:"metricsAuthCard", dashboardId:"metricsDashboard", messageId:"metricsAuthMessage", dashboardMessageId:"metricsDashboardMessage" });
    initBodyMetricsApp();
  </script>
</body>
</html>
