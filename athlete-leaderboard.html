<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MangoFitness | Benchmarks</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260905-barbell-names" />
  <link rel="manifest" href="manifest.webmanifest?v=20260905-barbell-names" />
  <link rel="apple-touch-icon" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MangoFitness" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
</head>
<body class="has-mobile-bottom-nav">
  <main class="container">
    <section class="card hero topbar app-shell">
      <div class="hero-main">
        <div class="brand-heading app-header-inner">
          <a class="brand-home-link" href="index.html" aria-label="MangoFitness home">
            <img class="app-brand-logo portal-brand-logo" src="assets/mangofitness-logo.png?v=20260711-landing-repair" alt="MangoFitness" />
          </a>
          <div class="portal-heading">
            <h1>Leaderboard</h1>
          </div>
        </div>
        <div class="app-nav-row">
          <nav class="app-tabs athlete-nav" aria-label="Athlete navigation">
            <a href="athlete.html" class="app-tab">Workouts</a>
            <a href="athlete-metrics.html" class="app-tab">Body Metrics</a>
            <a href="athlete-history.html" class="app-tab">Progress</a>
            <a href="athlete-leaderboard.html" class="app-tab active" aria-current="page">Benchmarks</a>
          </nav>
        </div>
        <div id="athleteLeaderboardHeaderAuth" class="header-auth hidden">
          <p id="athleteLeaderboardDashboardMessage" class="muted"></p>
          <button type="button" id="athleteLeaderboardSignOutBtn" class="app-sign-out header-sign-out hidden">Sign out</button>
        </div>
      </div>
      <p class="muted hero-description">Rank athletes for CrossFit WODs and row benchmarks only.</p>
    </section>

    <section id="athleteLeaderboardAuthCard" class="card auth-card">
      <h2>Athlete Sign In</h2>
      <div class="field"><label for="athleteLeaderboardEmail">Email</label><input id="athleteLeaderboardEmail" type="email" placeholder="Email" /></div>
      <div class="field"><label for="athleteLeaderboardPassword">Password</label><input id="athleteLeaderboardPassword" type="password" placeholder="Password" /></div>
      <div class="actions" style="margin-top:14px;"><button type="button" id="athleteLeaderboardSignInBtn" class="primary">Sign In</button><button type="button" id="athleteLeaderboardForgotBtn">Forgot Password</button></div>
      <p id="athleteLeaderboardAuthMessage" class="muted hidden" style="margin:12px 0 0;"></p>
    </section>

    <section id="athleteLeaderboardDashboard" class="dashboard-stack hidden">
      <div class="card dashboard-card">
        <div class="section-head compact"><div><h2>Leaderboard Filters</h2><p class="muted">Only CrossFit WODs and row benchmarks are included.</p></div></div>
        <div class="saved-filter-grid">
          <div class="field"><label for="leaderboardSearch">Search</label><input id="leaderboardSearch" type="search" placeholder="Search benchmark or athlete" /></div>
          <div class="field"><label for="leaderboardTypeFilter">Benchmark type</label><select id="leaderboardTypeFilter"><option value="all">All leaderboard events</option><option value="wod">CrossFit WODs</option><option value="cardio">Cardio</option><option value="row">Rows only</option><option value="strength">Strength</option><option value="gymnastics">Gymnastics</option></select></div>
        </div>
      </div>

      <div class="card dashboard-card">
        <div class="section-head compact"><div><h2>Leaderboard</h2><p class="muted">Best score per athlete for each event.</p></div></div>
        <div id="athleteLeaderboardList"></div>
      </div>
    </section>
  </main>
  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="athlete.html">Today</a>
    <a href="athlete-history.html">Progress</a>
    <a href="athlete-metrics.html">Metrics</a>
    <a href="athlete-leaderboard.html" class="active" aria-current="page">Board</a>
  </nav>
  <script src="assets/auth.js?v=20260905-mobile-auth"></script>
  <script src="assets/app.js?v=20260905-barbell-names"></script>
  <script>
    initLoginPage({ emailId:"athleteLeaderboardEmail", passwordId:"athleteLeaderboardPassword", signInBtnId:"athleteLeaderboardSignInBtn", forgotBtnId:"athleteLeaderboardForgotBtn", signOutBtnId:"athleteLeaderboardSignOutBtn", authCardId:"athleteLeaderboardAuthCard", dashboardId:"athleteLeaderboardDashboard", messageId:"athleteLeaderboardAuthMessage", dashboardMessageId:"athleteLeaderboardDashboardMessage" });
    initAthleteLeaderboardApp();
  </script>
</body>
</html>
