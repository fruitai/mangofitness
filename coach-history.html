<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MangoFitness | Progress</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260905-squat-clean-kettlebell" />
  <link rel="manifest" href="manifest.webmanifest?v=20260905-squat-clean-kettlebell" />
  <link rel="apple-touch-icon" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MangoFitness" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
</head>
<body>
  <main class="container">
    <section class="card hero topbar app-shell">
      <div class="hero-main">
        <div class="brand-heading app-header-inner">
          <a class="brand-home-link" href="index.html" aria-label="MangoFitness home">
            <img class="app-brand-logo portal-brand-logo" src="assets/mangofitness-logo.png?v=20260711-landing-repair" alt="MangoFitness" />
          </a>
          <div class="portal-heading">
            <h1>Progress History</h1>
          </div>
        </div>
        <div class="app-nav-row">
          <nav class="app-tabs coach-nav" aria-label="Coach navigation">
            <a href="admin.html" class="app-tab">Workouts</a>
            <a href="coach-clients.html" class="app-tab">Clients</a>
            <a href="coach-benchmarks.html" class="app-tab">Benchmarks</a>
            <a href="coach-movements.html" class="app-tab">Movements</a>
            <a href="coach-history.html" class="app-tab active" aria-current="page">Progress</a>
          </nav>
        </div>
        <div id="coachHistoryHeaderAuth" class="header-auth hidden">
          <p id="coachHistoryDashboardMessage" class="muted"></p>
          <button type="button" id="coachHistorySignOutBtn" class="app-sign-out header-sign-out hidden">Sign out</button>
        </div>
      </div>
      <p class="muted hero-description">Coach view for reviewing all athlete workout results.</p>
    </section>

    <section id="coachHistoryAuthCard" class="card auth-card">
      <h2>Coach Sign In</h2>
      <div class="field"><label for="coachHistoryEmail">Email</label><input id="coachHistoryEmail" type="email" placeholder="Email" /></div>
      <div class="field"><label for="coachHistoryPassword">Password</label><input id="coachHistoryPassword" type="password" placeholder="Password" /></div>
      <div class="actions" style="margin-top:14px;"><button type="button" id="coachHistorySignInBtn" class="primary">Sign In</button><button type="button" id="coachHistoryForgotBtn">Forgot Password</button></div>
      <p id="coachHistoryAuthMessage" class="muted hidden" style="margin:12px 0 0;"></p>
    </section>

    <section id="coachHistoryDashboard" class="dashboard-stack hidden">
      <div class="card dashboard-card">
        <div class="section-head compact"><div><h2>Progress Search</h2><p class="muted">Choose an athlete, search movements, or filter by result type.</p></div></div>
        <div class="progress-filter-grid">
          <div class="field"><label for="historyProfileSelect">Athlete</label><select id="historyProfileSelect"><option value="">All athletes</option></select></div>
          <div class="field"><label for="progressSearch">Search progress</label><input id="progressSearch" type="search" placeholder="Search movement, notes, score" /></div>
          <div class="field"><label for="progressTypeFilter">Type</label><select id="progressTypeFilter"><option value="all">All results</option><option value="pr">PRs only</option><option value="strength">Weights</option><option value="score">Scores</option></select></div>
        </div>
      </div>

      <div class="card dashboard-card">
        <div class="section-head compact"><div><h2>Athlete Results</h2><p class="muted">Recent logged workout results from all athletes.</p></div></div>
        <div id="coachResultsList"></div>
      </div>

      <div id="athleteHistoryList" class="hidden"></div>
    </section>
  </main>
  <script src="assets/auth.js?v=20260905-mobile-auth"></script>
  <script src="assets/app.js?v=20260905-squat-clean-kettlebell"></script>
  <script>
    initLoginPage({ emailId:"coachHistoryEmail", passwordId:"coachHistoryPassword", signInBtnId:"coachHistorySignInBtn", forgotBtnId:"coachHistoryForgotBtn", signOutBtnId:"coachHistorySignOutBtn", authCardId:"coachHistoryAuthCard", dashboardId:"coachHistoryDashboard", messageId:"coachHistoryAuthMessage", dashboardMessageId:"coachHistoryDashboardMessage", requiredRole:"coach" });
    initAthleteHistoryApp({ mode: "coach" });
  </script>
</body>
</html>
