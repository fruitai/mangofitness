<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MangoFitness | Reset Password</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260905-row-2k-merge" />
  <link rel="manifest" href="manifest.webmanifest?v=20260905-row-2k-merge" />
  <link rel="apple-touch-icon" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/mangofitness-icon.png?v=20260711-landing-repair" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MangoFitness" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
</head>
<body>
  <main class="container">
    <section class="card auth-card">
      <a class="brand-home-link auth-brand-link" href="index.html" aria-label="MangoFitness home"><img class="app-brand-logo portal-brand-logo" src="assets/mangofitness-logo.png?v=20260711-landing-repair" alt="MangoFitness" /></a>
      <h2>Reset Password</h2>
      <p class="muted">Enter a new password for your MangoFitness account.</p>
      <div class="field"><label for="newPassword">New Password</label><input id="newPassword" type="password" placeholder="New password" /></div>
      <div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" placeholder="Confirm password" /></div>
      <div class="actions" style="margin-top:14px;">
        <button type="button" id="savePasswordBtn" class="primary">Save Password</button>
        <button type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'">Back</button>
      </div>
      <p id="resetMessage" class="muted hidden" style="margin:12px 0 0;"></p>
    </section>
  </main>
  <script src="assets/auth.js?v=20260905-mobile-auth"></script>
  <script>initResetPasswordPage();</script>
</body>
</html>
